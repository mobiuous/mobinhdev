version: 1
mobinh-io:
  frontend:
    phases:
      preBuild:
        commands:
          - npm install --legacy-peer-deps
      build:
        commands:
          - echo "__NEXT_PRIVATE_PREBUNDLED_REACT=next" >> .env.production
          - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*